services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aab
      POSTGRES_PASSWORD: aab
      POSTGRES_DB: aab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aab -d aab"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
