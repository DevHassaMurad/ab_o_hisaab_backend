services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aab
      POSTGRES_PASSWORD: aab
      POSTGRES_DB: aab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aab -d aab"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Database for the new API structure (main.py, routes/, controller/, model/).
  # Root password and database name come from .env (DATABASE_PASSWORD, DATABASE_NAME).
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      # Local development only: lets the root password be empty when .env leaves DATABASE_PASSWORD blank.
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DATABASE_NAME:-aab_o_hisaab}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  mysqldata:
